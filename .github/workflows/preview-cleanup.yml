name: Preview cleanup

# When a pull request is closed without merging, its preview is removed from gh-pages
# and the sticky preview comment says so.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  cleanup:
    name: Remove preview
    # Forks never got a preview (their token cannot write).
    # Merged pull requests keep their preview: it holds the evidence linked from the PR, Jira and Slack.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    # Same group as every other job that writes gh-pages, so pushes never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Check for a gh-pages branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/branches/gh-pages" --silent 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gh-pages branch yet: nothing to clean up."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out gh-pages
        if: steps.branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview/pr-${{ github.event.pull_request.number }}
        id: remove
        if: steps.branch.outputs.exists == 'true'
        run: |
          dir="preview/pr-${PR_NUMBER}"
          if [ ! -d "$dir" ]; then
            echo "No $dir on gh-pages: nothing to remove."
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git rm -r --quiet "$dir"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "Remove preview for PR #${PR_NUMBER}"
          git push origin HEAD:gh-pages
          echo "removed=true" >> "$GITHUB_OUTPUT"

      - name: Mark the preview comment as removed
        if: steps.remove.outputs.removed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- trackwell-preview -->'
            const note = [
              '> [!NOTE]',
              `> The preview for this pull request was removed when it was ${context.payload.pull_request.merged ? 'merged' : 'closed'}.`,
              '> The screenshots below stay pinned to the last preview build; the preview link and videos no longer resolve.',
            ].join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const comment = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker))
            if (!comment) return core.info('No preview comment to update.')
            if (comment.body.includes('[!NOTE]')) return core.info('Preview comment already marked.')
            const body = comment.body.replace(marker, `${marker}\n${note}\n`)
            await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body })
            core.info(`Updated ${comment.html_url}`)
