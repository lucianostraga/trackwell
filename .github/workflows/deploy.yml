name: Deploy

# Every push to main is built for production and published to the root of the
# gh-pages branch. Previews under preview/ are kept.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  BASE_PREFIX: /${{ github.event.repository.name }}

jobs:
  build:
    name: Build & unit tests (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build for production
        run: |
          export BASE_PATH="${BASE_PREFIX}/"
          export VITE_ENV=production
          export VITE_BUILD_SHA="${GITHUB_SHA::7}"
          export VITE_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npm run build
          cat dist/version.json

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Same group as every other job that writes gh-pages, so pushes never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ env.PAGES_URL }}/
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist-production
          path: site

      - name: Publish to the gh-pages root (previews are kept)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Production deploy'
