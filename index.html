<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trackwell: find any piece of hospital equipment in seconds. Real-time equipment tracking for hospitals. (A fictional company for a demo.)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e8478" />
    <link rel="icon" type="image/svg+xml" href="/trackwell/favicon.svg" />
    <script>
      // Same rule as src/lib/theme.ts (resolveTheme), run before the first paint so a dark-system
      // visitor never sees a white page while the app loads. main.tsx applies it again.
      try {
        var stored = localStorage.getItem('trackwell-theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (e) {}
    </script>
    <title>Trackwell · Find any piece of hospital equipment in seconds</title>
    <script type="module" crossorigin src="/trackwell/assets/index-CXL_yHRM.js"></script>
    <link rel="stylesheet" crossorigin href="/trackwell/assets/index-BfAuFz6P.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
